  - slug: cloud-lambda-vs-fargate
    title: Lambda or ECS Fargate?
    kind: multiple_choice
    category: cloud
    difficulty: intermediate
    points: 10
    tags: [aws, compute, architecture]
    prompt_md: |
      You need to host an **agent run service** that streams tokens to clients over Server-Sent Events. Typical runs take
      20 seconds to 8 minutes, traffic is steady during business hours, and each instance keeps a warm connection pool to
      PostgreSQL. Which is the better default?
    options:
      - AWS Lambda behind API Gateway REST API
      - ECS on Fargate behind an Application Load Balancer, with autoscaling on CPU/request count
      - A single EC2 instance without autoscaling
      - S3 static website hosting
    correct_index: 1
    hints:
      - Consider maximum durations, streaming support and connection pooling.
    explanation_md: |
      Long-lived streaming connections, multi-minute runs and persistent DB pools fit containers. API Gateway REST APIs
      cap integrations at 29 seconds by default, and many short-lived Lambdas can exhaust database connections unless you
      add RDS Proxy. Lambda shines for spiky, short, event-driven work.

  - slug: weekly-deploy-fastapi-ecs
    title: "Weekly project: production deployment plan for a FastAPI + Postgres app"
    kind: manual_review
    category: cloud
