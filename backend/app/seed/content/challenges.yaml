  - slug: arch-cache-strategy
    title: Choosing a caching strategy
    kind: multiple_choice
    category: architecture
    difficulty: intermediate
    points: 10
    tags: [system-design, caching]
    prompt_md: |
      Course catalog pages are read ~5,000 times per minute and edited a few times per day by authors. Stale data for
      up to 60 seconds is acceptable, but a published fix should appear within a minute. Which strategy fits best?
    options:
      - No cache; scale the database vertically
      - Cache-aside in Redis with a 60-second TTL, plus explicit invalidation on publish
      - Write-through cache with synchronous replication to every app server
      - Cache responses forever in the CDN and ask authors to wait for redeploys
    correct_index: 1
    hints:
      - The read/write ratio is extreme, and the staleness budget is explicit.
    explanation_md: |
      Cache-aside with a TTL bounds staleness automatically, and invalidating on publish makes fixes visible immediately.
      Write-through adds write latency and complexity for data that rarely changes; caching forever breaks the 60-second
      requirement.

  - slug: arch-multi-tenant-rag
