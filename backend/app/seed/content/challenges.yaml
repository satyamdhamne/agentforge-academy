      2. Compute (ECS Fargate services, task sizes, autoscaling) and the database (RDS, backups, Multi-AZ).
      3. Secrets (Secrets Manager / SSM, IAM task roles) - no secrets in images or task definitions.
      4. CI/CD (GitHub Actions with OIDC to AWS, migrations, blue/green or rolling deploys, rollback).
