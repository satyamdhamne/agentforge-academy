# Standalone challenges (Daily Challenges / Challenge Engine).
# kind: code (auto-graded in the sandbox) | multiple_choice | manual_review (rubric, reviewed by a human)
# Grading data (tests, correct_index, rubric weights) is stored server-side and never sent before solving.
# Every code challenge is verified by scripts/verify_content.py: the solution passes, the starter does not.
challenges:
  # ------------------------------------------------------------------ coding
  - slug: py-two-sum
    title: Two-sum with a hash map
    kind: code
    category: coding
    difficulty: beginner
    language: python
    points: 10
    tags: [python, hash-maps, arrays]
    prompt_md: |
      Implement `two_sum(nums, target)` returning the **indices** `[i, j]` (with `i < j`) of the two numbers that add
      up to `target`. Exactly one answer exists. Aim for **O(n)** time - one pass with a dictionary.
    starter_code: |
      def two_sum(nums, target):
          # O(n^2) works, but try a single pass with a dict of value -> index
          return []
    tests:
      function: two_sum
      cases:
        - {args: [[2, 7, 11, 15], 9], expected: [0, 1]}
        - {args: [[3, 2, 4], 6], expected: [1, 2]}
        - {args: [[3, 3], 6], expected: [0, 1]}
        - {args: [[-1, 8, 4, 10, -3], 1], expected: [2, 4], hidden: true}
    hints:
      - For each number x, the partner you need is target - x.
      - Store each value's index in a dict *after* checking for its partner, so you never pair an element with itself.
    solution: |
      def two_sum(nums, target):
          seen = {}
          for j, x in enumerate(nums):
              if target - x in seen:
                  return [seen[target - x], j]
              seen[x] = j
          return []
    explanation_md: |
      A dictionary lookup is O(1) on average, so one pass gives O(n) time and O(n) memory. Checking for the partner
      *before* inserting the current value handles duplicates like `[3, 3]` correctly.

  - slug: js-group-by
    title: groupBy for API responses
    kind: code
    category: coding
    difficulty: beginner
    language: javascript
    points: 10
    tags: [javascript, arrays, objects]
    prompt_md: |
      Implement `groupBy(items, key)` that groups an array of objects by the value of `key` and returns an object
      mapping each value to the array of matching items, **preserving input order** inside each group.

      ```js
      groupBy([{t: "bug", id: 1}, {t: "feat", id: 2}, {t: "bug", id: 3}], "t")
      // { bug: [{t:"bug",id:1},{t:"bug",id:3}], feat: [{t:"feat",id:2}] }
      ```
    starter_code: |
      function groupBy(items, key) {
        const groups = {};
        // your code here
        return groups;
      }
    tests:
      function: groupBy
      cases:
        - args: [[{t: bug, id: 1}, {t: feat, id: 2}, {t: bug, id: 3}], t]
          expected: {bug: [{t: bug, id: 1}, {t: bug, id: 3}], feat: [{t: feat, id: 2}]}
        - {args: [[], t], expected: {}}
        - args: [[{team: a, n: 1}, {team: a, n: 2}], team]
          expected: {a: [{team: a, n: 1}, {team: a, n: 2}]}
          hidden: true
    hints:
      - Loop over items; create the array for a key the first time you see it.
    solution: |
      function groupBy(items, key) {
        const groups = {};
        for (const item of items) {
          const k = item[key];
          (groups[k] ||= []).push(item);
        }
        return groups;
      }
    explanation_md: |
      `||=` creates the bucket on first use. Modern runtimes also ship `Object.groupBy(items, (x) => x[key])`, but knowing
      the loop matters for older targets and interviews.

  - slug: py-token-bucket
    title: Token-bucket rate limiter
    kind: code
    category: coding
    difficulty: intermediate
    language: python
    points: 20
    tags: [python, rate-limiting, system-design]
    prompt_md: |
      APIs and LLM gateways protect themselves with **token buckets**. Implement
      `simulate(capacity, refill_per_sec, request_times)`:

      - The bucket starts **full** with `capacity` tokens at time `0`.
      - Tokens refill continuously at `refill_per_sec`, never exceeding `capacity`.
      - Each request (timestamps in seconds, sorted ascending) consumes **1** token if at least one is available.
      - Return a list of booleans: `True` if the request was allowed.
    starter_code: |
      def simulate(capacity, refill_per_sec, request_times):
          allowed = []
          for t in request_times:
              allowed.append(True)  # TODO: actually limit
          return allowed
    tests:
      function: simulate
      cases:
        - {args: [2, 1, [0, 0, 0]], expected: [true, true, false]}
        - {args: [2, 1, [0, 0, 0, 1.0]], expected: [true, true, false, true]}
        - {args: [1, 0.5, [0, 1, 2, 3, 4]], expected: [true, false, true, false, true]}
        - {args: [3, 10, [0, 0, 0, 0, 0.1, 0.1]], expected: [true, true, true, false, true, false], hidden: true}
    hints:
      - Track `tokens` and `last_time`. On each request, add (t - last_time) * refill_per_sec, capped at capacity.
      - Compare with `>= 1` before subtracting. Floating-point error is not an issue for these inputs.
    solution: |
      def simulate(capacity, refill_per_sec, request_times):
          tokens, last, allowed = float(capacity), 0.0, []
          for t in request_times:
              tokens = min(capacity, tokens + (t - last) * refill_per_sec)
              last = t
              if tokens >= 1:
                  tokens -= 1
                  allowed.append(True)
              else:
                  allowed.append(False)
          return allowed
    explanation_md: |
      Lazy refill (computing tokens only when a request arrives) needs no background timer, which is why Redis-backed
      limiters store just `tokens` and `last_refill`. Capacity controls burst size; refill rate controls the long-run average.

  - slug: py-lru-cache
    title: LRU cache from scratch
    kind: code
    category: coding
    difficulty: advanced
    language: python
    points: 30
    tags: [python, caching, data-structures]
    prompt_md: |
      Implement an LRU cache with O(1) `get` and `put`, then the test entry point `run_ops(capacity, ops)`:

      - `ops` is a list like `[["put", 1, "a"], ["get", 1], ...]`.
      - `get` returns the value or `-1`, and marks the key as most recently used.
      - `put` inserts/updates and marks as most recently used; when over capacity, evict the **least** recently used key.
      - `run_ops` returns the list of results of every `get`, in order.
    starter_code: |
      class LRUCache:
          def __init__(self, capacity):
              self.capacity = capacity
              self.data = {}

          def get(self, key):
              return self.data.get(key, -1)

          def put(self, key, value):
              self.data[key] = value  # never evicts!


      def run_ops(capacity, ops):
          cache, out = LRUCache(capacity), []
          for op in ops:
              if op[0] == "get":
                  out.append(cache.get(op[1]))
              else:
                  cache.put(op[1], op[2])
          return out
    tests:
      function: run_ops
      cases:
        - {args: [2, [[put, 1, a], [put, 2, b], [get, 1], [put, 3, c], [get, 2], [get, 3]]], expected: [a, -1, c]}
        - {args: [1, [[put, 1, a], [put, 1, b], [get, 1]]], expected: [b]}
        - {args: [2, [[put, 1, a], [put, 2, b], [put, 1, z], [put, 3, c], [get, 2], [get, 1]]], expected: [-1, z]}
        - {args: [3, [[get, 9], [put, 1, a], [put, 2, b], [put, 3, c], [get, 1], [put, 4, d], [get, 2], [get, 3], [get, 1]]], expected: [-1, a, -1, c, a], hidden: true}
    hints:
      - "`collections.OrderedDict` has `move_to_end(key)` and `popitem(last=False)`."
      - Updating an existing key must also refresh its recency.
    solution: |
      from collections import OrderedDict


      class LRUCache:
          def __init__(self, capacity):
              self.capacity = capacity
              self.data = OrderedDict()

          def get(self, key):
              if key not in self.data:
                  return -1
              self.data.move_to_end(key)
              return self.data[key]

          def put(self, key, value):
              self.data[key] = value
              self.data.move_to_end(key)
              if len(self.data) > self.capacity:
                  self.data.popitem(last=False)


      def run_ops(capacity, ops):
          cache, out = LRUCache(capacity), []
          for op in ops:
              if op[0] == "get":
                  out.append(cache.get(op[1]))
              else:
                  cache.put(op[1], op[2])
          return out
    explanation_md: |
      An OrderedDict is a hash map plus a doubly linked list, which is exactly the classic LRU design. In interviews you may
      be asked to build the linked list yourself - the invariant is the same: most recent at the tail, evict from the head.

  - slug: sql-running-total
    title: Daily revenue with a running total
    kind: code
    category: coding
    difficulty: advanced
    language: sql
    points: 25
    tags: [sql, window-functions, analytics]
    prompt_md: |
      Table: `payments(id, paid_on TEXT 'YYYY-MM-DD', amount REAL, status TEXT)`

      For **succeeded** payments, return one row per day with columns `day`, `revenue` (sum for that day) and
      `running_total` (cumulative revenue up to and including that day), ordered by `day`.
    starter_code: |
      SELECT paid_on AS day, SUM(amount) AS revenue, 0 AS running_total
      FROM payments
      GROUP BY paid_on
      ORDER BY day;
    sql:
      setup: |
        CREATE TABLE payments (id INTEGER PRIMARY KEY, paid_on TEXT, amount REAL, status TEXT);
        INSERT INTO payments (paid_on, amount, status) VALUES
          ('2026-01-01', 100, 'succeeded'), ('2026-01-01', 50, 'succeeded'), ('2026-01-01', 70, 'failed'),
          ('2026-01-02', 30, 'succeeded'), ('2026-01-03', 0.5, 'refunded'), ('2026-01-03', 20, 'succeeded'),
          ('2026-01-04', 200, 'failed');
      expected_columns: [day, revenue, running_total]
      expected_rows: [["2026-01-01", 150.0, 150.0], ["2026-01-02", 30.0, 180.0], ["2026-01-03", 20.0, 200.0]]
      ordered: true
    hints:
      - Aggregate per day first (a CTE or subquery), then apply `SUM(revenue) OVER (ORDER BY day)`.
      - Filter on status before grouping so failed payments never count.
    solution: |
      WITH daily AS (
        SELECT paid_on AS day, SUM(amount) AS revenue
        FROM payments
        WHERE status = 'succeeded'
        GROUP BY paid_on
      )
      SELECT day, revenue, SUM(revenue) OVER (ORDER BY day) AS running_total
      FROM daily
      ORDER BY day;
    explanation_md: |
      Window functions run *after* GROUP BY, so aggregating per day in a CTE and then windowing over the daily rows keeps
      the query readable. The default frame for `ORDER BY` in a window is "unbounded preceding to current row".

  # ------------------------------------------------------------------ debugging
  - slug: py-debug-mutable-default
    title: "Debug: tags leaking between calls"
    kind: code
    category: debugging
    difficulty: beginner
    language: python
    points: 10
    tags: [python, debugging, functions]
    prompt_md: |
      A teammate's helper is leaking tags between unrelated calls. `tag_twice(a, b)` calls `add_tag` twice and should return
      `[["a"], ["b"]]`, but returns `[["a", "b"], ["a", "b"]]`. **Find and fix the bug in `add_tag`** without changing
      `tag_twice`.
    starter_code: |
      def add_tag(tag, tags=[]):
          tags.append(tag)
          return tags


      def tag_twice(a, b):
          first = add_tag(a)
          second = add_tag(b)
          return [list(first), list(second)]
    tests:
      function: tag_twice
      cases:
        - {args: [a, b], expected: [[a], [b]]}
        - {args: [x, y], expected: [[x], [y]]}
        - {args: [urgent, bug], expected: [[urgent], [bug]], hidden: true}
    hints:
      - Default argument values are evaluated once, when the function is defined.
      - Use `None` as the default and create a new list inside the function.
    solution: |
      def add_tag(tag, tags=None):
          if tags is None:
              tags = []
          tags.append(tag)
          return tags


      def tag_twice(a, b):
          first = add_tag(a)
          second = add_tag(b)
          return [list(first), list(second)]
    explanation_md: |
      The list default is created once and shared by every call - a classic Python pitfall that also bites FastAPI and
      Pydantic users who put mutable defaults on models. Linters such as Ruff (rule B006) catch it automatically.

  - slug: js-debug-pagination
    title: "Debug: the missing first page"
    kind: code
    category: debugging
    difficulty: intermediate
    language: javascript
    points: 15
    tags: [javascript, debugging, apis]
    prompt_md: |
      Users report that page 1 of search results skips items and the last page is sometimes empty.
      `paginate(items, page, pageSize)` uses **1-based** pages and should return
      `{ data, page, totalPages, hasNext }`. Fix the bugs.
    starter_code: |
      function paginate(items, page, pageSize) {
        const totalPages = Math.floor(items.length / pageSize);
        const start = page * pageSize;
        const data = items.slice(start, start + pageSize);
        return { data, page, totalPages, hasNext: page <= totalPages };
      }
    tests:
      function: paginate
      cases:
        - {args: [[1, 2, 3, 4, 5], 1, 2], expected: {data: [1, 2], page: 1, totalPages: 3, hasNext: true}}
        - {args: [[1, 2, 3, 4, 5], 3, 2], expected: {data: [5], page: 3, totalPages: 3, hasNext: false}}
        - {args: [[], 1, 10], expected: {data: [], page: 1, totalPages: 0, hasNext: false}}
        - {args: [[1, 2, 3, 4], 2, 2], expected: {data: [3, 4], page: 2, totalPages: 2, hasNext: false}, hidden: true}
    hints:
      - With 1-based pages, the first index of page p is (p - 1) * pageSize.
      - Five items in pages of two is three pages - round up, not down.
      - There is a next page only when page < totalPages.
    solution: |
      function paginate(items, page, pageSize) {
        const totalPages = Math.ceil(items.length / pageSize);
        const start = (page - 1) * pageSize;
        const data = items.slice(start, start + pageSize);
        return { data, page, totalPages, hasNext: page < totalPages };
      }
    explanation_md: |
      Three independent off-by-one bugs: the offset (0- vs 1-based), the page count (floor vs ceil) and the `hasNext`
      comparison. Write tests for the first page, the last partial page and the empty list - those catch most pagination bugs.

  - slug: sql-debug-missing-customers
    title: "Debug: customers with no orders vanish"
    kind: code
    category: debugging
    difficulty: intermediate
    language: sql
    points: 15
    tags: [sql, joins, debugging]
    prompt_md: |
      The report should list **every** customer with their number of *paid* orders (0 if none), ordered by name.
      Customers without paid orders are missing from the output. Fix the query. Columns: `name`, `paid_orders`.
    starter_code: |
      SELECT c.name, COUNT(o.id) AS paid_orders
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.id
      WHERE o.status = 'paid'
      GROUP BY c.id, c.name
      ORDER BY c.name;
    sql:
      setup: |
        CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);
        CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, status TEXT);
        INSERT INTO customers VALUES (1,'Ada'),(2,'Brian'),(3,'Chen'),(4,'Dana');
        INSERT INTO orders (customer_id, status) VALUES (1,'paid'),(1,'paid'),(2,'refunded'),(3,'paid'),(1,'pending');
      expected_columns: [name, paid_orders]
      expected_rows: [["Ada", 2], ["Brian", 0], ["Chen", 1], ["Dana", 0]]
      ordered: true
    hints:
      - A WHERE condition on the right-hand table of a LEFT JOIN removes the NULL rows - it silently becomes an INNER JOIN.
      - Move the status filter into the ON clause.
    solution: |
      SELECT c.name, COUNT(o.id) AS paid_orders
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.id AND o.status = 'paid'
      GROUP BY c.id, c.name
      ORDER BY c.name;
    explanation_md: |
      Filters in `ON` decide which right-side rows *match*; filters in `WHERE` decide which *result rows survive*.
      `COUNT(o.id)` counts only non-NULL ids, so unmatched customers correctly get 0.

  # ------------------------------------------------------------------ agents & reliability
  - slug: py-agent-retry-policy
    title: Tool-call retry policy with backoff
    kind: code
    category: agent
    difficulty: intermediate
    language: python
    points: 20
    tags: [agents, reliability, retries]
    prompt_md: |
      An agent's tool calls fail intermittently. Implement `run_with_retries(outcomes, max_attempts, base_delay, max_delay)`
      that simulates calling a tool whose successive results are given by `outcomes`
      (e.g. `["timeout", "rate_limited", "ok"]`):

      - `"ok"` -> success. `"timeout"` and `"rate_limited"` are **retryable**. Anything else (e.g. `"invalid_args"`) is
        **not** retryable - stop immediately.
      - Before retry *n* (n = 1, 2, ...) wait `min(max_delay, base_delay * 2 ** (n - 1))` (exponential backoff, no jitter here).
      - Never make more than `max_attempts` attempts.

      Return `{"status": "ok" | "failed", "attempts": int, "delays": [...], "last_error": str | None}`.
    starter_code: |
      def run_with_retries(outcomes, max_attempts, base_delay, max_delay):
          return {"status": "ok", "attempts": 1, "delays": [], "last_error": None}
    tests:
      function: run_with_retries
      cases:
        - {args: [[ok], 3, 1, 10], expected: {status: ok, attempts: 1, delays: [], last_error: null}}
        - {args: [[timeout, rate_limited, ok], 5, 1, 10], expected: {status: ok, attempts: 3, delays: [1, 2], last_error: null}}
        - {args: [[timeout, timeout, timeout, timeout], 3, 2, 3], expected: {status: failed, attempts: 3, delays: [2, 3], last_error: timeout}}
        - {args: [[timeout, invalid_args, ok], 5, 1, 10], expected: {status: failed, attempts: 2, delays: [1], last_error: invalid_args}}
        - {args: [[rate_limited, rate_limited, rate_limited, rate_limited, ok], 5, 0.5, 4], expected: {status: ok, attempts: 5, delays: [0.5, 1.0, 2.0, 4], last_error: null}, hidden: true}
    hints:
      - Loop over attempts; on a retryable failure that isn't the last allowed attempt, compute the delay and continue.
      - Non-retryable errors (bad arguments) will fail the same way again - retrying them only burns budget.
    solution: |
      RETRYABLE = {"timeout", "rate_limited"}


      def run_with_retries(outcomes, max_attempts, base_delay, max_delay):
          delays, last_error = [], None
          for attempt in range(1, max_attempts + 1):
              result = outcomes[attempt - 1] if attempt - 1 < len(outcomes) else "ok"
              if result == "ok":
                  return {"status": "ok", "attempts": attempt, "delays": delays, "last_error": None}
              last_error = result
              if result not in RETRYABLE or attempt == max_attempts:
                  return {"status": "failed", "attempts": attempt, "delays": delays, "last_error": last_error}
              delays.append(min(max_delay, base_delay * 2 ** (attempt - 1)))
          return {"status": "failed", "attempts": max_attempts, "delays": delays, "last_error": last_error}
    explanation_md: |
      Production agents add **jitter** (randomise each delay) so many clients don't retry in lockstep, respect
      `Retry-After` headers, and only retry idempotent tools - a retried "send email" must carry an idempotency key.

  - slug: py-agent-loop-detector
    title: Detect a stuck agent loop
    kind: code
    category: agent
    difficulty: advanced
    language: python
    points: 25
    tags: [agents, guardrails, observability]
    prompt_md: |
      Agents sometimes call the same tool with the same arguments over and over. Implement
      `first_loop_step(calls, limit)` where `calls` is a list of `[tool_name, args_dict]` in order.

      Return the **0-based index** of the call at which the same `(tool, args)` pair has occurred `limit` times
      **in total** (not necessarily consecutively), or `-1` if that never happens. Argument dicts with the same keys and
      values in a different order are the same call.
    starter_code: |
      def first_loop_step(calls, limit):
          return -1
    tests:
      function: first_loop_step
      cases:
        - {args: [[[search, {q: a}], [search, {q: b}], [search, {q: a}], [read, {id: 1}], [search, {q: a}]], 3], expected: 4}
        - {args: [[[search, {q: a}], [search, {q: b}]], 2], expected: -1}
        - {args: [[[fetch, {url: x, page: 1}], [fetch, {page: 1, url: x}]], 2], expected: 1}
        - {args: [[[t, {a: 1}], [t, {a: 2}], [t, {a: 2}], [t, {a: 1}], [t, {a: 1}]], 3], expected: 4, hidden: true}
    hints:
      - Build a canonical key, e.g. `(tool, json.dumps(args, sort_keys=True))`, and count occurrences.
    solution: |
      import json
      from collections import Counter


      def first_loop_step(calls, limit):
          seen = Counter()
          for i, (tool, args) in enumerate(calls):
              key = (tool, json.dumps(args, sort_keys=True))
              seen[key] += 1
              if seen[key] >= limit:
                  return i
          return -1
    explanation_md: |
      Loop detection is a cheap guardrail that pairs well with step and token budgets: when it fires, stop the run, record
      the trace and hand the task to a human instead of burning tokens.

  - slug: py-workflow-execution-order
    title: Validate and order a workflow DAG
    kind: code
    category: agent
    difficulty: expert
    language: python
    points: 40
    tier: free
    tags: [agents, workflows, graphs]
    prompt_md: |
      The Agent Builder must reject cyclic graphs and run nodes in dependency order. Implement
      `execution_order(nodes, edges)`:

      - `nodes`: list of node ids. `edges`: list of `[source, target]` meaning *source must run before target*.
      - Return a topological order. When several nodes are ready at once, pick the **alphabetically smallest** first
        (so the answer is deterministic).
      - If the graph has a cycle, return `["CYCLE"]`. If an edge references an unknown node, return `["UNKNOWN_NODE"]`.
    starter_code: |
      def execution_order(nodes, edges):
          return sorted(nodes)
    tests:
      function: execution_order
      cases:
        - {args: [[input, llm, output], [[input, llm], [llm, output]]], expected: [input, llm, output]}
        - {args: [[a, b, c, d], [[a, c], [b, c], [c, d]]], expected: [a, b, c, d]}
        - {args: [[x, y], [[x, y], [y, x]]], expected: [CYCLE]}
        - {args: [[a, b], [[a, z]]], expected: [UNKNOWN_NODE]}
        - {args: [[retrieve, input, approve, llm, output], [[input, retrieve], [input, llm], [retrieve, llm], [llm, approve], [approve, output]]], expected: [input, retrieve, llm, approve, output], hidden: true}
    hints:
      - Kahn's algorithm - repeatedly take nodes with in-degree 0.
      - Use a min-heap (`heapq`) of ready nodes for the alphabetical tie-break.
      - If you emit fewer nodes than exist, the rest are in a cycle.
    solution: |
      import heapq


      def execution_order(nodes, edges):
          known = set(nodes)
          indegree = {n: 0 for n in nodes}
          children = {n: [] for n in nodes}
          for src, dst in edges:
              if src not in known or dst not in known:
                  return ["UNKNOWN_NODE"]
              children[src].append(dst)
              indegree[dst] += 1
          ready = [n for n in nodes if indegree[n] == 0]
          heapq.heapify(ready)
          order = []
          while ready:
              n = heapq.heappop(ready)
              order.append(n)
              for c in children[n]:
                  indegree[c] -= 1
                  if indegree[c] == 0:
                      heapq.heappush(ready, c)
          return order if len(order) == len(nodes) else ["CYCLE"]
    explanation_md: |
      Validating the graph *before* execution is what lets a workflow engine refuse unsafe definitions instead of
      failing halfway. LangGraph allows cycles on purpose (agent loops) but bounds them with a recursion limit.

  # ------------------------------------------------------------------ RAG
  - slug: py-recall-at-k
    title: Measure retrieval with recall@k and MRR
    kind: code
    category: rag
    difficulty: intermediate
    language: python
    points: 20
    tags: [rag, evaluation, metrics]
    prompt_md: |
      You can't tune a RAG pipeline you don't measure. Implement `retrieval_metrics(runs, k)` where `runs` is a list of
      `{"retrieved": [doc ids in rank order], "relevant": [doc ids]}`. Return `{"recall_at_k": float, "mrr": float}`:

      - **recall@k** for one query = (relevant docs found in the top *k*) / (number of relevant docs). Average over queries.
      - **MRR** = mean over queries of `1 / rank` of the *first* relevant doc anywhere in the list (0 if none).
      - Round both to 4 decimal places. Queries with no relevant docs are skipped. Return zeros if nothing remains.
    starter_code: |
      def retrieval_metrics(runs, k):
          return {"recall_at_k": 0.0, "mrr": 0.0}
    tests:
      function: retrieval_metrics
      compare: approx
      cases:
        - {args: [[{retrieved: [a, b, c], relevant: [a]}], 1], expected: {recall_at_k: 1.0, mrr: 1.0}}
        - {args: [[{retrieved: [x, a, b], relevant: [a, b]}, {retrieved: [y, z, q], relevant: [q]}], 2], expected: {recall_at_k: 0.25, mrr: 0.4167}}
        - {args: [[{retrieved: [a], relevant: []}], 3], expected: {recall_at_k: 0.0, mrr: 0.0}}
        - {args: [[{retrieved: [d1, d2, d3, d4], relevant: [d4, d2]}, {retrieved: [d9], relevant: [d1]}], 3], expected: {recall_at_k: 0.25, mrr: 0.25}, hidden: true}
    hints:
      - Use sets for membership; slice `retrieved[:k]` for recall.
      - MRR uses the 1-based rank of the first relevant hit.
    solution: |
      def retrieval_metrics(runs, k):
          recalls, rr = [], []
          for run in runs:
              relevant = set(run["relevant"])
              if not relevant:
                  continue
              hits = len(relevant & set(run["retrieved"][:k]))
              recalls.append(hits / len(relevant))
              rank = next((i + 1 for i, d in enumerate(run["retrieved"]) if d in relevant), None)
              rr.append(1 / rank if rank else 0.0)
          if not recalls:
              return {"recall_at_k": 0.0, "mrr": 0.0}
          return {"recall_at_k": round(sum(recalls) / len(recalls), 4), "mrr": round(sum(rr) / len(rr), 4)}
    explanation_md: |
      Recall@k tells you whether the answer is *available* to the model; MRR tells you how high it ranks, which matters
      when you truncate context. Track both per release on a fixed labelled query set.

  - slug: py-reciprocal-rank-fusion
    title: Hybrid search with reciprocal rank fusion
    kind: code
    category: rag
    difficulty: advanced
    language: python
    points: 25
    tags: [rag, hybrid-search, ranking]
    prompt_md: |
      Hybrid search merges a keyword (BM25) ranking with a vector ranking. Scores aren't comparable, so we fuse **ranks**.
      Implement `rrf(rankings, k, top_n)`:

      - `rankings`: list of ranked lists of doc ids (best first).
      - Each doc's score = sum over lists containing it of `1 / (k + rank)`, with **1-based** rank.
      - Return the `top_n` doc ids by score, descending; break ties alphabetically by doc id.
    starter_code: |
      def rrf(rankings, k, top_n):
          # naive: just concatenate - wrong!
          out = []
          for r in rankings:
              for d in r:
                  if d not in out:
                      out.append(d)
          return out[:top_n]
    tests:
      function: rrf
      cases:
        - {args: [[[a, b, c], [c, a, d]], 60, 3], expected: [a, c, b]}
        - {args: [[[x], [y]], 60, 2], expected: [x, y]}
        - {args: [[[d3, d1], [d2, d1], [d1]], 1, 2], expected: [d1, d2]}
        - {args: [[[p, q, r, s], [s, r, q, p]], 60, 4], expected: [p, s, q, r], hidden: true}
    hints:
      - Accumulate scores in a dict, then sort with key `(-score, doc_id)`.
    solution: |
      def rrf(rankings, k, top_n):
          scores = {}
          for ranking in rankings:
              for rank, doc in enumerate(ranking, start=1):
                  scores[doc] = scores.get(doc, 0.0) + 1.0 / (k + rank)
          return [d for d, _ in sorted(scores.items(), key=lambda x: (-x[1], x[0]))][:top_n]
    explanation_md: |
      RRF needs no score normalisation and is robust to one retriever being badly calibrated, which is why pgvector +
      full-text setups and many vector databases use it by default. `k = 60` (from the original paper) damps the
      influence of top positions.

  - slug: rag-boundary-misses
    title: "Tuning: answers split across chunks"
    kind: multiple_choice
    category: rag
    difficulty: intermediate
    points: 10
    tags: [rag, chunking]
    prompt_md: |
      Your policy-docs RAG assistant often answers "the document doesn't say" for questions whose answer spans the end of
      one paragraph and the start of the next. You use **fixed 200-token chunks with 0 overlap**, top-k = 3. Retrieval
      recall@3 on your eval set is 0.62. What is the best **first** change to test?
    options:
      - Switch to a larger LLM so it can infer the missing half of the answer
      - Use structure-aware chunking (split on headings/paragraphs) with ~10-20% overlap, then re-measure recall@3
      - Increase top-k to 50 so every chunk is always included
      - Lower the temperature to 0 so the model stops refusing
    correct_index: 1
    hints:
      - The symptom is a retrieval problem, not a generation problem.
    explanation_md: |
      Answers that straddle boundaries need overlap or semantically coherent chunks. Change one variable and re-run the
      same retrieval eval. A bigger model can't cite text it never received; top-k = 50 bloats context, cost and latency
      and buries the evidence; temperature doesn't fix missing context.

