      - {criterion: compute_and_data, weight: 2, description: "Sensible Fargate sizing and autoscaling; RDS with backups, encryption and a Multi-AZ decision."}
      - {criterion: secrets_and_iam, weight: 2, description: "Secrets Manager/SSM, task roles, no long-lived CI keys (OIDC)."}
      - {criterion: delivery, weight: 2, description: "Pipeline with tests, migrations ordering, safe rollout and rollback plan."}
      - {criterion: operations_and_cost, weight: 1, description: "Alarms on meaningful signals and a cost estimate with stated assumptions."}
    hints:
      - Run migrations as a one-off task before shifting traffic, and keep them backwards compatible.
