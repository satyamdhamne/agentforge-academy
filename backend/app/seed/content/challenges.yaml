  # ------------------------------------------------------------------ timed interview
  - slug: interview-merge-intervals
    title: "Timed: merge meeting intervals"
    kind: code
    category: interview
    difficulty: intermediate
    language: python
    points: 20
    time_limit_minutes: 20
    tags: [interview, arrays, sorting]
    prompt_md: |
      **Timed interview question (20 minutes).** Given a list of `[start, end]` intervals (unsorted, `start <= end`),
      merge all overlapping intervals and return them sorted by start. Intervals that touch (`[1,3]` and `[3,5]`) merge.

      Think out loud: state the complexity before you code.
    starter_code: |
      def merge(intervals):
          return intervals
    tests:
      function: merge
      cases:
        - {args: [[[1, 3], [2, 6], [8, 10], [15, 18]]], expected: [[1, 6], [8, 10], [15, 18]]}
        - {args: [[[1, 4], [4, 5]]], expected: [[1, 5]]}
        - {args: [[]], expected: []}
        - {args: [[[5, 7], [1, 2], [2, 3], [6, 9], [11, 12]]], expected: [[1, 3], [5, 9], [11, 12]], hidden: true}
    hints:
      - Sort by start, then extend the last merged interval while the next one starts before (or at) its end.
    solution: |
      def merge(intervals):
          merged = []
          for start, end in sorted(intervals):
              if merged and start <= merged[-1][1]:
                  merged[-1][1] = max(merged[-1][1], end)
              else:
                  merged.append([start, end])
          return merged
    explanation_md: |
      Sorting dominates: O(n log n) time, O(n) output. Interviewers also listen for edge cases (empty input, touching
      intervals, fully contained intervals) and whether you mutate the input.

  - slug: interview-js-flatten
    title: "Timed: deep-flatten without Array.flat"
    kind: code
    category: interview
    difficulty: beginner
    language: javascript
    points: 15
    time_limit_minutes: 15
    tags: [interview, javascript, recursion]
    prompt_md: |
      **Timed (15 minutes).** Implement `flatten(value, depth)` that flattens nested arrays up to `depth` levels
      (`depth` = `Infinity` is passed as the string `"inf"` in tests). Do not use `Array.prototype.flat`.
    starter_code: |
      function flatten(value, depth) {
        return value;
      }
    tests:
      function: flatten
      cases:
        - {args: [[1, [2, [3, [4]]]], inf], expected: [1, 2, 3, 4]}
        - {args: [[1, [2, [3, [4]]]], 1], expected: [1, 2, [3, [4]]]}
        - {args: [[[], [[]]], inf], expected: []}
        - {args: [[1, [2, [3]], [[4]]], 2], expected: [1, 2, 3, 4], hidden: true}
    hints:
      - Recurse with depth - 1 when you meet an array and depth > 0.
    solution: |
      function flatten(value, depth) {
        const d = depth === "inf" ? Infinity : depth;
        const out = [];
        for (const item of value) {
          if (Array.isArray(item) && d > 0) out.push(...flatten(item, d - 1));
          else out.push(item);
        }
        return out;
      }
    explanation_md: |
      Recursion mirrors the structure. For extremely deep input, an explicit stack avoids call-stack overflow - mention it
      as a follow-up.
