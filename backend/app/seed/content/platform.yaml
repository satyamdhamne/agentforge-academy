# Plans, achievements, real-world projects and announcements.

# Feature limits per plan. limit: null = unlimited; enabled: false = not included.
entitlements:
  free:
    sandbox_runs_per_day: {limit: 100}
    agent_runs_per_day: {limit: 25}
    real_model_agent_runs: {enabled: false}
    pro_content: {enabled: false}
    team_dashboards: {enabled: false}
  pro:
    sandbox_runs_per_day: {limit: 1000}
    agent_runs_per_day: {limit: 200}
    real_model_agent_runs: {enabled: true}
    pro_content: {enabled: true}
    team_dashboards: {enabled: false}
  team:
    sandbox_runs_per_day: {limit: null}
    agent_runs_per_day: {limit: 500}
    real_model_agent_runs: {enabled: true}
    pro_content: {enabled: true}
    team_dashboards: {enabled: true}

