# Baseline skill check used by the AI mentor to suggest a starting track. Two questions per area.
questions:
  - {id: p1, area: programming, prompt: "What does this Python print? `x = [1, 2]; y = x; y.append(3); print(len(x))`", options: ["2", "3", "Error"], answer: 1, explanation: "`y = x` copies the reference, not the list, so both names see the append."}
  - {id: p2, area: programming, prompt: "Which data structure gives average O(1) lookup by key?", options: ["List", "Hash map / dict", "Linked list"], answer: 1, explanation: "Hash maps hash the key to a bucket, so lookups don't scan."}
  - {id: j1, area: javascript, prompt: "What does `typeof null` return in JavaScript?", options: ["'null'", "'object'", "'undefined'"], answer: 1, explanation: "A historical quirk of the language: `typeof null` is 'object'."}
  - {id: j2, area: javascript, prompt: "Which runs first: a resolved promise's `.then` callback or `setTimeout(fn, 0)`?", options: ["setTimeout", ".then callback", "It's random"], answer: 1, explanation: "Promise callbacks are microtasks, which run before the next macrotask (timer)."}
  - {id: w1, area: web, prompt: "Which HTTP status means the client sent too many requests?", options: ["403", "429", "503"], answer: 1, explanation: "429 Too Many Requests, often with a Retry-After header."}
  - {id: w2, area: web, prompt: "What does an HttpOnly cookie protect against?", options: ["JavaScript reading the cookie (e.g. via XSS)", "Sending it over HTTP", "CSRF entirely"], answer: 0, explanation: "HttpOnly hides the cookie from scripts; CSRF needs separate protection."}
  - {id: d1, area: databases, prompt: "A query filters by `customer_id` on a 10M-row table and is slow. First thing to check?", options: ["Add more RAM", "Whether an index on customer_id exists (EXPLAIN)", "Switch to NoSQL"], answer: 1, explanation: "Check the plan; a missing index causes full scans."}
  - {id: d2, area: databases, prompt: "Which keyword groups rows so you can SUM per customer?", options: ["ORDER BY", "GROUP BY", "PARTITION"], answer: 1, explanation: "GROUP BY with an aggregate like SUM()."}
  - {id: c1, area: cloud, prompt: "Where should an application's database password live on AWS?", options: ["In the Docker image", "In Secrets Manager / SSM, read via an IAM role", "In the Git repository"], answer: 1, explanation: "Managed secrets with IAM-scoped access and rotation."}
  - {id: c2, area: cloud, prompt: "What does 'least privilege' mean?", options: ["Admins only", "Grant only the permissions a role needs", "Use the root account carefully"], answer: 1, explanation: "Scope permissions to exactly what's required."}
  - {id: g1, area: genai, prompt: "Roughly how many English characters is one token?", options: ["1", "About 4", "About 20"], answer: 1, explanation: "A useful rule of thumb is ~4 characters (~0.75 words) per token."}
  - {id: g2, area: genai, prompt: "What makes a model's output most reliably valid JSON?", options: ["Asking politely", "Structured output / JSON schema mode plus validation", "Higher temperature"], answer: 1, explanation: "Schema-constrained decoding and server-side validation."}
  - {id: r1, area: rag, prompt: "Where should document permissions be enforced in RAG?", options: ["In the retrieval query, before text reaches the model", "In the system prompt", "After the answer is generated"], answer: 0, explanation: "Filter at retrieval so restricted text never reaches the prompt."}
  - {id: r2, area: rag, prompt: "Which metric tells you whether the relevant passage was retrieved at all?", options: ["BLEU", "Recall@k", "Perplexity"], answer: 1, explanation: "Recall@k: was the relevant document in the top k?"}
  - {id: a1, area: agents, prompt: "An agent can send emails. What's the most important safeguard?", options: ["A longer system prompt", "Human approval before the send, with the exact recipient and body", "A bigger model"], answer: 1, explanation: "Side effects behind approval limit the damage of mistakes or injection."}
  - {id: a2, area: agents, prompt: "When is a fixed workflow better than an autonomous agent?", options: ["When the steps are known in advance", "Never", "When you need tools"], answer: 0, explanation: "Known steps -> a workflow is cheaper, faster and easier to test."}
