    icon: lock
    color: red
    level: intermediate
    outcomes: [Recognise and mitigate prompt injection, Apply least privilege to AI tools, Handle PII responsibly]
    courses:
      - slug: securing-llm-apps
        title: Securing LLM Applications
        level: intermediate
        hours: 5
        modules:
          - slug: threats
            title: Threats
            lessons:
              - {slug: prompt-injection-defense, title: "Prompt injection: threats and defenses"}
              - {slug: pii-handling-ai, title: "PII handling in AI systems"}
              - {slug: tenant-isolation, title: "Tenant isolation for AI features"}

  - slug: ai-interviews
    title: AI Engineering Interviews
    summary: Theory, coding, system design and behavioral preparation with transparent rubrics.
    icon: mic
    color: yellow
    level: intermediate
    outcomes: [Structure answers to AI system design questions, Practise with rubric-based feedback]
