[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-agents"
version = "0.3.0"
description = "Reference agent implementations for AgentForge Academy"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.2"]
otel = ["opentelemetry-api>=1.25"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["agentforge_agents*"]

[tool.setuptools.package-data]
"agentforge_agents" = ["**/*.jsonl", "**/*.md", "**/*.txt", "**/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "B023", "UP047", "B008", "E741", "B905"]
