name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Agents, sandbox, backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentforge" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agentforge:agentforge@localhost:5432/agentforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # the sandbox executes JavaScript challenges with node
      - name: Install
        run: python -m pip install -e "./agents[dev,pdf]" -e "./backend[dev]" -e "./sandbox[dev]"
      - name: Lint
        run: ruff check agents backend sandbox scripts
      - name: Agent tests and evaluations
        run: |
          cd agents
          python -m pytest -q
          python -m agentforge_agents eval all
      - name: Sandbox tests
        run: cd sandbox && python -m pytest -q
      - name: Verify seed content (examples print their documented output; solutions pass, starters fail)
        run: python scripts/verify_content.py
      - name: Backend integration tests (PostgreSQL, migrations, seed)
        run: cd backend && python -m pytest -q
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://agentforge:agentforge@localhost:5432/agentforge_test
        run: cd backend && python -m alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          CI: "true"
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
